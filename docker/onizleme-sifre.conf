# İsteğe bağlı şifre: yalnızca ONIZLEME_SIFRE doluysa docker/giris.sh bunu etkinleştirir.
# Sayfalar PHP'de (app/lib/onizleme.php), statik dosyalar ve PDF'ler burada aynı kullanıcı/şifreyle korunur.
<Directory /var/www/html>
  AuthType Basic
  AuthName "Tekayper onizleme"
  AuthUserFile /etc/apache2/onizleme.htpasswd
  Require valid-user
  # Sağlık denetimi (Render) kimlik doğrulamasız
  <Files "saglik.html">
    Require all granted
  </Files>
</Directory>
