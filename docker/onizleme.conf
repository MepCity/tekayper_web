# Önizleme (staging) için Apache ayarı. Yalnızca TEKAYPER_ONIZLEME=1 iken docker/giris.sh bunu etkinleştirir.

# Yanıtta tam olarak bir X-Robots-Tag olsun: PHP'nin (bootstrap) eklediği kopya silinir, sonra tek kez konur.
<IfModule mod_headers.c>
  Header unset X-Robots-Tag
  Header always set X-Robots-Tag "noindex, nofollow"
</IfModule>

# Adresler Host başlığına göre kurulsun; sunucunun dinlediği iç port (10000) dışarı sızmasın.
UseCanonicalName Off
UseCanonicalPhysicalPort Off

<IfModule mod_setenvif.c>
  # .htaccess'teki https/www yönlendirmesini önizlemede atlar (adres canlı alan adına gitmesin; yerel http denemesi de çalışsın).
  SetEnvIf Request_URI "." TKY_ONIZLEME=1

  # Render gibi bir HTTPS vekilinin arkasındayız: dış adresin kökü. Apache yönlendirmeleri (.htaccess) bunu hedefe ekler;
  # böylece Location "https://alanadi/..." olur, ":10000" ve "http" sızmaz. Başlık yalnızca önizleme kipinde dikkate alınır.
  SetEnvIf Host "^(.+)$" TKY_TABAN=http://$1
  SetEnvIfExpr "%{HTTP:X-Forwarded-Proto} == 'https' && %{HTTP_HOST} =~ /^(.+)$/" TKY_TABAN=https://$1
  SetEnvIfExpr "%{HTTP:X-Forwarded-Proto} == 'https'" HTTPS=on
</IfModule>
