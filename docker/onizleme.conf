# Önizleme (staging) için Apache ayarı. Yalnızca TEKAYPER_ONIZLEME=1 iken docker/giris.sh bunu etkinleştirir.
<IfModule mod_headers.c>
  Header always set X-Robots-Tag "noindex, nofollow"
</IfModule>

# .htaccess'teki https/www yönlendirmesini önizlemede atlar (adres canlı alan adına gitmesin; yerel http denemesi de çalışsın).
<IfModule mod_setenvif.c>
  SetEnvIf Request_URI "." TKY_ONIZLEME=1
</IfModule>
