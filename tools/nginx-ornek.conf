# Tekayper: nginx örnek ayarı (barındırma yöneticisi için). Canlı sunucu nginx; .htaccess dikkate alınmayabilir.
# Mevcut server bloğunuza aşağıdaki kuralları ekleyin. PHP-FPM soket yolunu kendi sunucunuza göre düzeltin.

# http ve www olmayan adres -> https://www.tekayper.com
server {
    listen 80;
    listen [::]:80;
    server_name tekayper.com www.tekayper.com;
    return 301 https://www.tekayper.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tekayper.com;
    # ssl_certificate ...; ssl_certificate_key ...;
    return 301 https://www.tekayper.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.tekayper.com;
    # ssl_certificate ...; ssl_certificate_key ...;

    root /var/www/tekayper;          # site/ klasörünün içeriği
    index index.php;
    charset utf-8;

    error_page 404 /404.php;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # erişime kapalı klasörler ve dosyalar
    location ~ ^/(app|storage|tools|_dev)(/|$) { deny all; return 404; }
    location ~ /\. { deny all; return 404; }
    location ~* \.(md|lock|log|jsonl|sh|ttf)$ { deny all; return 404; }

    # eski adresler
    location = /teknokol.php          { return 301 /urunler.php#armendus; }
    location = /kol-sistemleri.php    { return 301 /urunler.php#armendus; }
    location = /pano-sistemleri.php   { return 301 /urunler.php#armendus; }
    location = /kiosk-sistemleri.php  { return 301 /urunler.php#armendus; }
    location = /baglanti-kuleleri.php { return 301 /urunler.php#armendus; }
    # eski form ucu: GET yönlendirilir, POST PHP dosyasında 410 alır
    location = /iletisimSmtp.php {
        if ($request_method = GET) { return 301 /iletisim.php; }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    # /index.php -> /
    location = /index.php {
        if ($request_uri ~ "^/index\.php(\?|$)") { return 301 /$is_args$args; }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~* \.(woff2|avif|webp|jpg|jpeg|png|svg|ico|css|js|mp3|mp4)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location ~* \.pdf$ { expires 7d; try_files $uri =404; }

    location / { try_files $uri $uri/ =404; }

    location ~ \.php$ {
        try_files $uri =404;            # olmayan .php dosyası 404.php'ye düşer
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain application/xml;
    client_max_body_size 1m;
}
